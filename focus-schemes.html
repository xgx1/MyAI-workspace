<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>焦点防抢方案对比器</title>
<style>
:root{
  --bg:#0B1220;
  --panel:#111827;
  --card:#1F2937;
  --card2:#273449;
  --fg:#F8FAFC;
  --muted:#CBD5E1;
  --subtle:#94A3B8;
  --border:#334155;
  --accent:#22C55E;
  --accent-fg:#052E16;
  --warn:#F59E0B;
  --danger:#EF4444;
  --info:#38BDF8;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--fg);
  font-size:16px;line-height:1.65;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
.wrap{max-width:1320px;margin:0 auto;padding:20px 18px 40px}
h1{margin:0 0 6px;font-size:26px;font-weight:700}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.topbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;
}
.search{
  flex:1 1 280px;min-width:220px;
  background:var(--card);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:11px 13px;font-size:15px;
}
.search:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{
  background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:8px;padding:9px 13px;font-size:14px;cursor:pointer;font-weight:500;
}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{
  background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:8px;padding:9px 13px;font-size:14px;cursor:pointer;font-weight:500;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px}
.stat b{color:var(--accent)}

.list{display:flex;flex-direction:column;gap:10px}
.row{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;
}
.row.selected{border-color:var(--accent);background:var(--card2)}
.row-head{display:flex;align-items:flex-start;gap:12px}
.cb{
  width:22px;height:22px;border:2px solid var(--border);border-radius:6px;
  background:var(--panel);cursor:pointer;flex-shrink:0;margin-top:2px;
  display:grid;place-items:center;
}
.cb.checked{background:var(--accent);border-color:var(--accent)}
.cb svg{opacity:0}
.cb.checked svg{opacity:1}
.row-title{font-size:17px;font-weight:600;margin:0}
.row-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tag{
  font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);font-weight:500;
}
.tag.niri{border-color:#818cf8;color:#c7d2fe;background:rgba(99,102,241,.15)}
.tag.wayland{border-color:#38bdf8;color:#bae6fd;background:rgba(56,189,248,.15)}
.tag.browser{border-color:#f472b6;color:#fbcfe8;background:rgba(244,114,182,.15)}
.tag.system{border-color:#fbbf24;color:#fde68a;background:rgba(251,191,36,.15)}
.tag.other{border-color:#94a3b8;color:#e2e8f0;background:rgba(148,163,184,.15)}
.tag.low{border-color:#22c55e;color:#bbf7d0;background:rgba(34,197,94,.15)}
.tag.med{border-color:#f59e0b;color:#fde68a;background:rgba(245,158,11,.15)}
.tag.high{border-color:#ef4444;color:#fecaca;background:rgba(239,68,68,.15)}
.row-desc{color:var(--muted);font-size:15px;margin:0 0 8px}
.snippet{
  background:#0B1220;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;font-family:ui-monospace,"Cascadia Mono",monospace;
  font-size:13px;color:#E2E8F0;white-space:pre-wrap;word-break:break-word;
  margin-top:8px;
}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:15px}
.side{
  position:fixed;right:16px;bottom:16px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;min-width:230px;
}
.side h3{margin:0 0 4px;font-size:15px}
.side .num{font-size:24px;font-weight:700;color:var(--accent)}
.side .hint{font-size:13px;color:var(--muted)}
.side .btn{width:100%;margin-top:8px}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:8px;
  font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
@media (max-width:720px){
  .side{left:16px;right:16px;min-width:0}
  .row-head{flex-direction:column}
}
button:focus-visible,input:focus-visible,.cb:focus-visible,.row:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>焦点防抢方案对比器</h1>
  <p class="sub">Arch + niri 26.04 · 本机执行 · 无 VM。勾选你要启用的方案；选择会自动保存在浏览器。</p>

  <div class="topbar">
    <input id="search" class="search" type="search" placeholder="搜索方案名称 / 描述 / 配置…" aria-label="搜索方案" />
    <div class="filters" id="filters" role="group" aria-label="类别筛选"></div>
    <button class="btn" id="selectAllVisible" type="button">全选可见</button>
    <button class="btn" id="clearAll" type="button">清空</button>
    <button class="btn primary" id="exportBtn" type="button">导出已选</button>
  </div>

  <div class="stats">
    <div class="stat">总计：<b id="statTotal">0</b></div>
    <div class="stat">已选：<b id="statSelected">0</b></div>
    <div class="stat">当前显示：<b id="statVisible">0</b></div>
  </div>

  <main id="list" class="list" aria-live="polite"></main>
  <div id="empty" class="empty" hidden>没有匹配的方案。</div>
</div>

<aside class="side" aria-label="已选方案摘要">
  <h3>已选方案</h3>
  <div class="num" id="sideCount">0</div>
  <div class="hint" id="sideHint">勾选卡片即可加入</div>
  <button class="btn primary" id="copySelected" type="button">复制已选配置</button>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const CATEGORIES = [
  {id:'all',label:'全部'},
  {id:'niri',label:'niri'},
  {id:'wayland',label:'Wayland/XDG'},
  {id:'browser',label:'浏览器'},
  {id:'system',label:'系统服务'},
  {id:'other',label:'其它'}
];
const CATLABEL={niri:'niri',wayland:'Wayland/XDG',browser:'浏览器',system:'系统服务',other:'其它'};
const RISK={low:'低风险',med:'中风险',high:'高风险'};

const ITEMS = [
 {id:1,cat:'niri',risk:'low',title:'全局 open-focused false',desc:'新窗口打开时，不自动把焦点切到它。',snippet:'window-rule {\n    open-focused false\n}'},
 {id:2,cat:'niri',risk:'low',title:'全局 on-xdg-activate "ignore"',desc:'所有应用请求“激活我”都无效；只标 urgent，绝不切前台。',snippet:'window-rule {\n    on-xdg-activate "ignore"\n}'},
 {id:3,cat:'niri',risk:'low',title:'on-xdg-activate "set-urgent"',desc:'需要提示时只标 urgent，不抢焦点（ignore 的温和版）。',snippet:'window-rule {\n    on-xdg-activate "set-urgent"\n}'},
 {id:4,cat:'niri',risk:'low',title:'关闭 focus-follows-mouse',desc:'避免鼠标悬停时自动切焦点。',snippet:'input {\n    focus-follows-mouse off\n}'},
 {id:5,cat:'niri',risk:'med',title:'strict-new-window-focus-policy',desc:'收紧新窗口焦点策略（若当前版本支持）。',snippet:'// niri 新版支持时启用\nstrict-new-window-focus-policy'},
 {id:6,cat:'niri',risk:'low',title:'honor-xdg-activation-with-invalid-serial false',desc:'拒绝没有合法 serial 的激活请求。',snippet:'// 若 niri 提供该选项\nhonor-xdg-activation-with-invalid-serial false'},
 {id:7,cat:'niri',risk:'low',title:'deactivate-unfocused-windows',desc:'失焦窗口去激活，降低被抢焦点概率。',snippet:'// 若 niri 提供该选项\ndeactivate-unfocused-windows'},
 {id:8,cat:'niri',risk:'med',title:'禁用或不启动 XWayland',desc:'移除 X11 抢焦点通道；纯 Wayland 应用不受影响。',snippet:'xwayland {\n    off\n}'},
 {id:9,cat:'niri',risk:'low',title:'命名工作区 + open-on-workspace',desc:'按会话或应用隔离窗口，避免堆叠和切换。',snippet:'workspace "s1"\nwindow-rule {\n    match app-id=r#""helium""#\n    open-on-workspace "s1"\n}'},
 {id:10,cat:'niri',risk:'low',title:'open-on-output',desc:'多显示器下把窗口固定到指定输出或工作区。',snippet:'window-rule {\n    match app-id=r#""helium""#\n    open-on-output "DP-2"\n}'},
 {id:11,cat:'niri',risk:'low',title:'IPC move-window-to-workspace --focus false',desc:'移动窗口时不附带聚焦。',snippet:'niri msg action move-window-to-workspace --focus false "s1"'},
 {id:12,cat:'niri',risk:'low',title:'set-workspace-name',desc:'每会话一个命名工作区，便于脚本路由。',snippet:'niri msg action set-workspace-name "session-42"'},
 {id:13,cat:'niri',risk:'med',title:'仅显式聚焦',desc:'只用 focus-window 或快捷键聚焦，关闭一切自动聚焦。',snippet:'// 移除自动聚焦相关规则，保留手动 Mod+方向'},
 {id:14,cat:'wayland',risk:'low',title:'依赖 XDG Activation 协议',desc:'无 token 或无 serial 不给焦点（niri 默认）。',snippet:'// 无需配置，compositor 默认策略'},
 {id:15,cat:'wayland',risk:'med',title:'清空 XDG_ACTIVATION_TOKEN',desc:'让应用无法“合法”激活，作为补充手段。',snippet:'unset XDG_ACTIVATION_TOKEN'},
 {id:16,cat:'wayland',risk:'high',title:'独立 WAYLAND_DISPLAY 或 socket',desc:'不同会话跑在不同 compositor 或 socket（多实例场景）。',snippet:'WAYLAND_DISPLAY=wayland-1 <app>'},
 {id:17,cat:'wayland',risk:'low',title:'import-environment + portal 重启',desc:'确保服务拿到当前 compositor 环境，避免旧会话前台化。',snippet:'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP\nsystemctl --user restart xdg-desktop-portal.service'},
 {id:18,cat:'browser',risk:'low',title:'Chromium / Helium 后台参数',desc:'保证后台标签不被节流或切前。',snippet:'--disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows'},
 {id:19,cat:'browser',risk:'low',title:'浏览器扩展：后台打开',desc:'后台打开链接，禁止标签抢焦点。',snippet:'// 安装 Open in Background 类扩展'},
 {id:20,cat:'browser',risk:'low',title:'独立浏览器 profile',desc:'每会话或工作区独立 profile，避免标签焦点串扰。',snippet:'--user-data-dir=/home/sx/.config/helium-session-42'},
 {id:21,cat:'browser',risk:'med',title:'Firefox about:config 调整',desc:'调整后台标签加载与窗口聚焦相关项（以实际存在项为准）。',snippet:'browser.tabs.loadInBackground = true'},
 {id:22,cat:'system',risk:'med',title:'systemd user unit 托管',desc:'Restart=always，避免进程直接 attach 前台。',snippet:'[Unit]\nDescription=...\n[Service]\nExecStart=...\nRestart=always'},
 {id:23,cat:'system',risk:'med',title:'mask D-Bus GUI 服务 + linger',desc:'禁用不必要的自动拉起；保持 user manager。',snippet:'systemctl --user mask <service>\nloginctl enable-linger sx'},
 {id:24,cat:'other',risk:'low',title:'通知守护不聚焦',desc:'点击通知不聚焦或不切换窗口（swaync 配置）。',snippet:'// swaync: notification 不触发 focus'},
 {id:25,cat:'other',risk:'low',title:'剪贴板监听后台',desc:'wl-paste --watch 保持后台，不抢焦点。',snippet:'wl-paste --watch cliphist store'},
 {id:26,cat:'other',risk:'low',title:'portal 截图不抢焦点',desc:'截图走 xdg-desktop-portal，避免工具前台化。',snippet:'xdg-desktop-portal-gnome (Screenshot portal)'}
];

const STORAGE_KEY='focus-schemes-selected-v2';
let selected=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));
let activeCat='all';
let query='';

const filters=document.getElementById('filters');
const list=document.getElementById('list');
const empty=document.getElementById('empty');
const search=document.getElementById('search');

function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...selected]));}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function buildFilters(){
  filters.innerHTML='';
  CATEGORIES.forEach(c=>{
    const b=document.createElement('button');
    b.className='fbtn'+(c.id===activeCat?' active':'');
    b.type='button';b.textContent=c.label;
    b.setAttribute('aria-pressed',c.id===activeCat?'true':'false');
    b.addEventListener('click',()=>{activeCat=c.id;render();buildFilters();});
    filters.appendChild(b);
  });
}
function matches(item){
  if(activeCat!=='all' && item.cat!==activeCat) return false;
  if(!query) return true;
  const q=query.toLowerCase();
  return (item.title+item.desc+item.snippet+CATLABEL[item.cat]).toLowerCase().includes(q);
}
function render(){
  list.innerHTML='';
  const visible=ITEMS.filter(matches);
  document.getElementById('statTotal').textContent=ITEMS.length;
  document.getElementById('statSelected').textContent=selected.size;
  document.getElementById('statVisible').textContent=visible.length;
  document.getElementById('sideCount').textContent=selected.size;
  document.getElementById('sideHint').textContent=selected.size?('已选 '+selected.size+' 项'):'勾选卡片即可加入';
  if(!visible.length){empty.hidden=false;return;}
  empty.hidden=true;
  visible.forEach(item=>{
    const row=document.createElement('article');
    row.className='row'+(selected.has(item.id)?' selected':'');
    row.tabIndex=0;
    const head=document.createElement('div');head.className='row-head';
    const cb=document.createElement('div');
    cb.className='cb'+(selected.has(item.id)?' checked':'');
    cb.setAttribute('role','checkbox');
    cb.setAttribute('aria-checked',selected.has(item.id)?'true':'false');
    cb.setAttribute('tabindex','0');
    cb.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#052E16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const toggle=()=>{ if(selected.has(item.id)) selected.delete(item.id); else selected.add(item.id); persist(); render(); };
    cb.addEventListener('click',e=>{e.stopPropagation();toggle();});
    cb.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
    const content=document.createElement('div');content.style.flex='1';
    const title=document.createElement('h2');title.className='row-title';title.textContent=item.title;
    const meta=document.createElement('div');meta.className='row-meta';
    const t1=document.createElement('span');t1.className='tag '+item.cat;t1.textContent=CATLABEL[item.cat];
    const t2=document.createElement('span');t2.className='tag '+item.risk;t2.textContent=RISK[item.risk];
    meta.appendChild(t1);meta.appendChild(t2);
    const desc=document.createElement('p');desc.className='row-desc';desc.textContent=item.desc;
    const snip=document.createElement('pre');snip.className='snippet';snip.textContent=item.snippet;
    content.appendChild(title);content.appendChild(meta);content.appendChild(desc);content.appendChild(snip);
    head.appendChild(cb);head.appendChild(content);
    row.appendChild(head);
    row.addEventListener('click',e=>{ if(e.target!==cb) toggle(); });
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    list.appendChild(row);
  });
}
search.addEventListener('input',e=>{query=e.target.value;render();});
document.getElementById('selectAllVisible').addEventListener('click',()=>{
  ITEMS.filter(matches).forEach(i=>selected.add(i.id));persist();render();toast('已全选可见项');
});
document.getElementById('clearAll').addEventListener('click',()=>{selected.clear();persist();render();toast('已清空');});
document.getElementById('exportBtn').addEventListener('click',()=>{
  const out=ITEMS.filter(i=>selected.has(i.id)).map(i=>'#'+i.id+' '+i.title+'\n'+i.snippet).join('\n\n');
  const blob=new Blob([out||'（未选择任何方案）'],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='selected-focus-schemes.txt';a.click();
  URL.revokeObjectURL(a.href);toast('已导出');
});
document.getElementById('copySelected').addEventListener('click',async()=>{
  const out=ITEMS.filter(i=>selected.has(i.id)).map(i=>'#'+i.id+' '+i.title+'\n'+i.snippet).join('\n\n')||'（未选择任何方案）';
  try{await navigator.clipboard.writeText(out);toast('已复制到剪贴板');}
  catch(e){toast('复制失败，请手动选择');}
});
buildFilters();render();
</script>
</body>
</html>
